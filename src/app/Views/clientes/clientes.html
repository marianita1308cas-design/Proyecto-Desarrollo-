
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Clientes</h2>
  </div>

  @if (error) {
    <div class="alert alert-danger">
      {{ error }}
    </div>
  }

  <div class="card">
    <div class="card-body">
      <p class="text-center" [hidden]="!cargando">Cargando clientes...</p>
      <app-table [hidden]="cargando" [data]="clientes"></app-table>
    </div>
  </div>
</div>
