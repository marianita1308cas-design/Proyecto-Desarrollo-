<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/inventario" routerLinkActive="active-link">Inventario</a>
      <a mat-list-item routerLink="/proveedores" routerLinkActive="active-link">Proveedores</a>
      <a mat-list-item routerLink="/ventas" routerLinkActive="active-link">Ventas</a>
      <a mat-list-item routerLink="/clientes" routerLinkActive="active-link">Clientes</a>
      <a mat-list-item routerLink="/mat-table" routerLinkActive="active-link">Tabla</a>
      <a mat-list-item routerLink="/login" routerLinkActive="active-link">Login</a>

    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar style="background-color: rgb(13, 186, 209);">
      @if (isHandset$ | async) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>MOTOS MC</span>
    </mat-toolbar>
<router-outlet></router-outlet>

  </mat-sidenav-content>
</mat-sidenav-container>
